name: Docker and Vercel CI/CD Pipeline

on:
  push:
    branches: 
      - master
  pull_request:
    branches: 
      - master

jobs:
  build-docker-push:
    runs-on: ubuntu-latest    
    steps:
     - name: Checkout code
       uses: actions/checkout@v4
     
     - name: Log into dockerhub
       uses: docker/login-action@v4
       with:
         username: youssefnjmm
         password: ${{ secrets.DOCKERHUB_TOKEN }}

     - name: Build and Push docker image
       uses: docker/build-push-action@v6
       with:
        context: .
        push: true
        tags: youssefnjmm/portfolio:v1.0.0

  deploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Deploy to Vercel (Preview on PR, Prod on Push)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: ${{ github.event_name == 'push' && '--prod --yes' || '--yes' }}